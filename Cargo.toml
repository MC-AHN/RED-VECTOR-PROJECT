[package]
name = "red-vector-project"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.2"
dashmap = "6.2.1"
jsonwebtoken = "10.4.0"
lazy_static = "1.5.0"
rand = { version = "0.10.1", features = ["thread_rng"] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["chrono", "json", "postgres", "runtime-tokio-native-tls", "uuid"] }
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }
